<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 246" width="1060" height="246">
  <defs>
    <style>
      .bg { fill: #f7f5f0; stroke: #111111; stroke-width: 1.5; }
      .line { fill: none; stroke: #111111; stroke-width: 1.5; }
      .dashed { fill: none; stroke: #111111; stroke-width: 1.4; stroke-dasharray: 5 3; }
      .dotted { fill: none; stroke: #111111; stroke-width: 1.3; stroke-dasharray: 2 3; opacity: 0.6; }
      .arrow { fill: #111111; }
      .box { fill: #f7f5f0; stroke: #111111; stroke-width: 1.6; }
      .box-dashed { fill: #f7f5f0; stroke: #111111; stroke-width: 1.5; stroke-dasharray: 5 3; }
      .box-solid { fill: #111111; stroke: #111111; stroke-width: 1.6; }
      .shadow { fill: #111111; }
      .lbl { fill: #111111; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 700; }
      .lbl-inv { fill: #f7f5f0; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 700; }
      .sub { fill: #111111; font-family: "JetBrains Mono", Consolas, monospace; font-size: 9.5px; opacity: 0.72; }
    </style>
  </defs>

  <!-- Outer Off-White Frame -->
  <rect x="1" y="1" width="1058" height="244" rx="6" class="bg" />

  <g transform="translate(10, 10)">
    <!-- 1. SESSION NOTEPAD FEEDBACK LOOP (Top Lane) -->
    <path d="M 890 96 L 890 20 L 598 20" class="dashed" />
    <polygon points="596,20 602,16 602,24" class="arrow" />

    <path d="M 420 20 L 174 20 L 174 50" class="dashed" />
    <polygon points="174,52 170,46 178,46" class="arrow" />

    <path d="M 316 20 L 316 94" class="dashed" />
    <polygon points="316,96 312,90 320,90" class="arrow" />

    <path d="M 555 34 L 555 42 L 605 42 L 605 94" class="dashed" />
    <polygon points="605,96 601,90 609,90" class="arrow" />

    <!-- 2. MAIN HIERARCHICAL NAVIGATION GRAPH (Left -> Right) -->
    <path d="M 90 114 L 258 114" class="line" />
    <path d="M 104 114 L 104 69 L 118 69" class="line" />
    <polygon points="120,69 114,65 114,73" class="arrow" />
    <path d="M 104 114 L 104 159 L 118 159" class="line" />
    <polygon points="120,159 114,155 114,163" class="arrow" />

    <path d="M 228 69 L 244 69 L 244 114" class="line" />
    <path d="M 228 159 L 244 159 L 244 114" class="line" />
    <polygon points="260,114 254,110 254,118" class="arrow" />

    <!-- Pages <-> Top-50 Rescore vertical loop -->
    <path d="M 300 132 L 300 146" class="dashed" />
    <polygon points="300,148 296,142 304,142" class="arrow" />
    <path d="M 332 148 L 332 134" class="dashed" />
    <polygon points="332,132 328,138 336,138" class="arrow" />

    <!-- Pages -> Sections (>60 passages) or direct -> Passages -->
    <path d="M 372 114 L 542 114" class="line" />
    <path d="M 388 114 L 388 69 L 402 69" class="line" />
    <polygon points="404,69 398,65 398,73" class="arrow" />
    <path d="M 512 69 L 528 69 L 528 114" class="line" />
    <polygon points="544,114 538,110 538,118" class="arrow" />

    <!-- Passages -> Choice Rerank or direct -> Ranked -->
    <path d="M 666 114 L 846 114" class="line" />
    <path d="M 682 114 L 682 69 L 696 69" class="line" />
    <polygon points="698,69 692,65 692,73" class="arrow" />
    <path d="M 816 69 L 832 69 L 832 114" class="line" />
    <polygon points="848,114 842,110 842,118" class="arrow" />

    <!-- Ranked -> Answer -->
    <path d="M 932 114 L 950 114" class="line" />
    <polygon points="952,114 946,110 946,118" class="arrow" />

    <!-- 3. DECISION MODEL BUS TICKS -->
    <path d="M 174 176 L 174 194" class="dotted" />
    <path d="M 316 178 L 316 194" class="dotted" />
    <path d="M 458 86 L 458 194" class="dotted" />
    <path d="M 605 132 L 605 194" class="dotted" />
    <path d="M 757 86 L 757 194" class="dotted" />

    <!-- 4. NODES -->
    <!-- Session Notepad -->
    <rect x="420" y="6" width="176" height="28" rx="3" class="box-dashed" />
    <text x="508" y="21" text-anchor="middle" dominant-baseline="middle" class="lbl">Session Notepad</text>

    <!-- Query (Highlighted Active Entry) -->
    <rect x="14" y="98" width="78" height="36" rx="3" class="shadow" />
    <rect x="12" y="96" width="78" height="36" rx="3" class="box-solid" />
    <text x="51" y="115" text-anchor="middle" dominant-baseline="middle" class="lbl-inv">Query</text>

    <!-- Categories & Clusters -->
    <rect x="120" y="52" width="108" height="34" rx="3" class="box" />
    <text x="174" y="70" text-anchor="middle" dominant-baseline="middle" class="lbl">Categories</text>

    <rect x="120" y="142" width="108" height="34" rx="3" class="box" />
    <text x="174" y="160" text-anchor="middle" dominant-baseline="middle" class="lbl">Clusters</text>

    <!-- Pages & Top-50 Rescore -->
    <rect x="260" y="96" width="112" height="36" rx="3" class="box" />
    <text x="316" y="115" text-anchor="middle" dominant-baseline="middle" class="lbl">Pages</text>

    <rect x="260" y="148" width="112" height="30" rx="3" class="box-dashed" />
    <text x="316" y="164" text-anchor="middle" dominant-baseline="middle" class="lbl">Top-50 Rescore</text>

    <!-- Sections -->
    <rect x="404" y="52" width="108" height="34" rx="3" class="box" />
    <text x="458" y="65" text-anchor="middle" dominant-baseline="middle" class="lbl">Sections</text>
    <text x="458" y="78" text-anchor="middle" dominant-baseline="middle" class="sub">&gt;60 passages</text>

    <!-- Passages -->
    <rect x="544" y="96" width="122" height="36" rx="3" class="box" />
    <text x="605" y="115" text-anchor="middle" dominant-baseline="middle" class="lbl">Passages</text>

    <!-- Choice Rerank -->
    <rect x="698" y="52" width="118" height="34" rx="3" class="box" />
    <text x="757" y="70" text-anchor="middle" dominant-baseline="middle" class="lbl">Choice Rerank</text>

    <!-- Ranked -->
    <rect x="848" y="96" width="84" height="36" rx="3" class="box" />
    <text x="890" y="115" text-anchor="middle" dominant-baseline="middle" class="lbl">Ranked</text>

    <!-- Answer -->
    <rect x="952" y="96" width="78" height="36" rx="3" class="box" />
    <text x="991" y="115" text-anchor="middle" dominant-baseline="middle" class="lbl">Answer</text>

    <!-- Decision Model Bus -->
    <rect x="122" y="196" width="696" height="26" rx="3" class="shadow" />
    <rect x="120" y="194" width="696" height="26" rx="3" class="box-solid" />
    <text x="468" y="208" text-anchor="middle" dominant-baseline="middle" class="lbl-inv">Decision Model · Clef-Flash 9B / Jev 1.13 / GPT-6 Luna</text>
  </g>
</svg>
